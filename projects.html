<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Projects | 3kh0</title>
    <meta name="keywords" content="front-end web developer, unblocked, games, google sites, unblocked games mom, ublocked, code, coding, programmer, development, javascript, jquery, bootstrap, sass, less, git" />
    <meta property="og:title" content="Welcome to 3kh0 lite, a lightweight, fast, and clean game site." />
    <meta property="og:site_name" content="3kh0.github.io" />
    <meta property="og:description" content="Welcome to 3kh0 lite, a lightweight, fast, and clean game site." />
    <meta name="description" content="Welcome to 3kh0 lite, a lightweight, fast, and clean game site." />
    <meta name="author" content="3kh0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="shortcut-icon" href="/favicon.ico" />
    <script src="/js/main.js"></script>
    <style>
      :root {
        --bg-primary: #121212;
        --text-primary: #ffffff;
        --card-bg: #1e1e1e;
        --card-hover: #2a2a2a;
        --accent-green: #22c55e;
        --accent-purple: #b625cc;
        --border-radius: 16px;
        --transition: all 0.3s ease;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: 'Segoe UI', system-ui, sans-serif;
        line-height: 1.6;
        padding: 2rem 1rem;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      #search {
        width: 100%;
        max-width: 600px;
        padding: 12px 24px;
        font-size: 1rem;
        border: none;
        border-radius: 50px;
        background: #2d2d2d;
        color: white;
        margin: 0 auto 2rem;
        display: block;
        transition: var(--transition);
      }

      #search:focus {
        outline: 2px solid var(--accent-green);
        background: #333;
      }

      #loader {
        display: block;
        border: 6px solid #333;
        border-top: 6px solid var(--accent-green);
        border-radius: 50%;
        width: 48px;
        height: 48px;
        animation: spin 1s linear infinite;
        margin: 2rem auto;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .flex-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.8rem;
        justify-items: center;
      }

      .game-link {
        text-decoration: none;
        color: inherit;
        display: block;
        width: 100%;
        max-width: 300px;
      }

      .game-tile {
        background: var(--card-bg);
        border-radius: var(--border-radius);
        overflow: hidden;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        transition: var(--transition);
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .game-tile:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        background: var(--card-hover);
      }

      .game-icon {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-bottom: 1px solid #333;
      }

      .game-title {
        padding: 1rem;
        font-size: 1.25rem;
        font-weight: 600;
        text-align: center;
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Buttons */
      .btn {
        cursor: pointer;
        background-color: var(--accent-green);
        border: none;
        color: white;
        padding: 12px 28px;
        font-size: 1rem;
        border-radius: 50px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
        font-weight: 600;
      }

      .btn:hover {
        background-color: #1da54d;
        transform: scale(1.03);
      }

      .btn-purple {
        background-color: var(--accent-purple);
      }

      .btn-purple:hover {
        background-color: #9b1fb4;
      }

      .action-buttons {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      #back-to-top {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--accent-purple);
        color: white;
        border: none;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        z-index: 100;
        transition: var(--transition);
      }

      #back-to-top:hover {
        background: #9b1fb4;
        transform: translateY(-3px);
      }

      /* Responsive */
      @media (max-width: 600px) {
        h1 {
          font-size: 2rem;
        }
        .game-icon {
          height: 180px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Projects</h1>

    <input
      type="text"
      id="search"
      onkeyup="searchGames()"
      placeholder="Search for games..."
    />

    <div id="loader"></div>

    <div id="game-container" class="flex-container"></div>

    <div class="action-buttons">
      <a href="/index.html" class="btn btn-purple">Go to the homepage</a>
    </div>

    <button id="back-to-top" aria-label="Back to top">↑</button>

    <script>
      let games = [];
      const gameContainer = document.getElementById("game-container");
      const loader = document.getElementById("loader");

      fetch("config/games.json")
        .then((response) => response.json())
        .then((data) => {
          games = data;
          renderGames(data);
          loader.style.display = "none";
        })
        .catch((error) => {
          console.error("Error loading games:", error);
          loader.innerHTML = "Failed to load games.";
          loader.style.border = "none";
          loader.style.color = "red";
        });

      function renderGames(gameList) {
        gameContainer.innerHTML = "";
        gameList.forEach((project) => {
          const gameLink = document.createElement("a");
          gameLink.href = project.link;
          gameLink.className = "game-link";
          gameLink.innerHTML = `
            <div class="game-tile">
              <img class="game-icon" src="${project.imgSrc}" alt="${project.title} icon" loading="lazy" />
              <div class="game-title">${project.title}</div>
            </div>
          `;
          gameContainer.appendChild(gameLink);
        });
      }

      function searchGames() {
        const query = document.getElementById("search").value.trim().toLowerCase();
        const filtered = games.filter((game) =>
          game.title.toLowerCase().includes(query)
        );
        renderGames(filtered);
      }

      // Back to top button
      const backToTopButton = document.getElementById("back-to-top");
      window.addEventListener("scroll", () => {
        if (window.scrollY > 200) {
          backToTopButton.style.display = "flex";
        } else {
          backToTopButton.style.display = "none";
        }
      });

      backToTopButton.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    </script>
  </body>
</html>
